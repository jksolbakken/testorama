name: yolo

on:
  workflow_dispatch:

jobs:
  first_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: "checkout"
        uses: actions/checkout@v7
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: 3f259ca3-0401-4cdb-8fa7-907f321e1306
          domain: "https://eu.infisical.com"
          project-slug: example-project-g-k8-q
          env-slug: "dev"
      - name: Use the secrets
        run: "echo got the supersecret $TESTSECRET"

